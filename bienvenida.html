<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KaKo - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* OCULTAR LA BARRA DE DESPLAZAMIENTO GLOBALMENTE */
        ::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Edge */
        }
        * {
            -ms-overflow-style: none;  /* IE y Edge */
            scrollbar-width: none;  /* Firefox */
        }

        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Usamos 100dvh para que se ajuste a la barra de direcciones del móvil */
            height: 100dvh; 
            overflow: hidden;
            user-select: none;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh; /* Altura dinámica para móviles */
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            #app-container {
                height: 92vh;
                border-radius: 40px;
                box-shadow: 0 0 50px rgba(0,0,0,0.1);
            }
        }

        /* --- PÁGINA DE REGISTRO --- */
        .register-page {
            position: absolute;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 30px;
            overflow-y: auto; /* Permite scroll si el formulario es muy largo */
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .register-page.active {
            right: 0;
        }

        .register-logo {
            width: 140px;
            margin-bottom: 20px;
            margin-top: 10px;
            object-fit: contain;
        }

        .register-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1e3c72;
            margin-bottom: 5px;
            text-align: center;
        }

        .register-subtitle {
            font-size: 0.85rem;
            color: #718096;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            width: 100%;
            margin-bottom: 15px;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 2px solid #edf2f7;
            border-radius: 16px;
            font-size: 1rem;
            color: #2d3748;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }

        .form-group input:focus {
            border-color: #ff4b8b;
            background: #ffffff;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 40%, #ff4b8b 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 75, 139, 0.3);
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .login-link {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 20px;
        }

        .login-link a {
            color: #ff4b8b;
            font-weight: 700;
            text-decoration: none;
        }

        /* --- CONTENIDO PRINCIPAL (Logo + Video) --- */
        #mainContent {
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s;
        }

        .logo-section {
            padding: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            z-index: 10;
            flex-shrink: 0; /* Evita que el logo se encoja */
        }

        .logo-section img {
            height: 70px; /* Ajustado para pantallas pequeñas */
            object-fit: contain;
        }

        .video-container {
            flex: 1;
            padding: 10px 15px 20px 15px; /* Menos padding para aprovechar espacio */
            position: relative;
            z-index: 5;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background-color: #000;
            transition: transform 0.3s ease-out;
        }

        .video-wrapper.draggable {
            cursor: grab;
        }
        .video-wrapper.draggable:active {
            cursor: grabbing;
        }

        .video-wrapper.locked::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.2);
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .loading-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: #ff4b8b;
            width: 0%;
            transition: width 0.1s linear;
            z-index: 10;
        }

    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- PÁGINA DE REGISTRO -->
        <div class="register-page" id="registerPage">
            <img src="log.png" alt="KaKo Logo" class="register-logo" onerror="this.src='https://via.placeholder.com/200x100/ffffff/1e3c72?text=KaKo'">
            
            <h1 class="register-title">Crea tu cuenta</h1>
            <p class="register-subtitle">Únete a la comunidad</p>

            <form id="registerForm" style="width: 100%;">
                <div class="form-group">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Nombre completo" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Correo electrónico" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn-register">Registrarse</button>
            </form>

            <div class="login-link">
                ¿Ya tienes cuenta? <a href="perfilsinpago.html" onclick="event.preventDefault(); alert('Aquí iría el login');">Inicia Sesión</a>
          
           
            
            </div>
    <a href="perfilsinpago.html" >sin pago</a></br>
     <a href="perfilconpago.html" >con pago</a>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div id="mainContent">
            
            <!-- Logo Superior -->
            <div class="logo-section">
                <img src="log.png" alt="KaKo Logo" onerror="this.src='https://via.placeholder.com/200x100/ffffff/1e3c72?text=KaKo'">
            </div>

            <!-- Video Principal -->
            <div class="video-container">
                <div class="video-wrapper locked" id="draggableVideo">
                    <video autoplay loop muted playsinline>
                        <source src="intro.mp4" type="video/mp4">
                    </video>
                    <div class="loading-bar" id="loadingBar"></div>
                </div>
            </div>

        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videoWrapper = document.getElementById('draggableVideo');
            const mainContent = document.getElementById('mainContent');
            const registerPage = document.getElementById('registerPage');
            const loadingBar = document.getElementById('loadingBar');
            
            let canDrag = false;
            let isDragging = false;
            let startX = 0;
            let currentX = 0;
            const dragThreshold = 80; // Reducido un poco para facilitar el deslizamiento en móviles

            // --- 1. LÓGICA DE BLOQUEO DE 5 SEGUNDOS ---
            let progress = 0;
            const duration = 5000;
            const interval = 50;
            const step = (interval / duration) * 100;

            const timer = setInterval(() => {
                progress += step;
                loadingBar.style.width = Math.min(progress, 100) + '%';

                if (progress >= 100) {
                    clearInterval(timer);
                    canDrag = true;
                    videoWrapper.classList.remove('locked');
                    videoWrapper.classList.add('draggable');
                    loadingBar.style.opacity = '0';
                }
            }, interval);

            // --- 2. EVENTOS TÁCTILES ---
            videoWrapper.addEventListener('touchstart', (e) => {
                if (!canDrag) return;
                isDragging = true;
                startX = e.touches[0].clientX;
                videoWrapper.style.transition = 'none';
            }, { passive: true });

            videoWrapper.addEventListener('touchmove', (e) => {
                if (!isDragging || !canDrag) return;
                currentX = e.touches[0].clientX;
                const diffX = currentX - startX;

                if (diffX < 0) {
                    videoWrapper.style.transform = `translateX(${diffX}px)`;
                }
            }, { passive: false });

            videoWrapper.addEventListener('touchend', () => {
                if (!isDragging) return;
                isDragging = false;
                videoWrapper.style.transition = 'transform 0.3s ease-out';
                
                const diffX = currentX - startX;
                if (diffX < -dragThreshold && canDrag) {
                    swipeToNext();
                } else {
                    videoWrapper.style.transform = 'translateX(0)';
                }
            });

            // --- 3. EVENTOS DE RATÓN ---
            videoWrapper.addEventListener('mousedown', (e) => {
                if (!canDrag) return;
                isDragging = true;
                startX = e.clientX;
                videoWrapper.style.transition = 'none';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging || !canDrag) return;
                currentX = e.clientX;
                const diffX = currentX - startX;
                if (diffX < 0) {
                    videoWrapper.style.transform = `translateX(${diffX}px)`;
                }
            });

            window.addEventListener('mouseup', () => {
                if (!isDragging) return;
                isDragging = false;
                videoWrapper.style.transition = 'transform 0.3s ease-out';
                
                const diffX = currentX - startX;
                if (diffX < -dragThreshold && canDrag) {
                    swipeToNext();
                } else {
                    videoWrapper.style.transform = 'translateX(0)';
                }
            });

            function swipeToNext() {
                videoWrapper.style.transform = 'translateX(-100vw)';
                setTimeout(() => {
                    registerPage.classList.add('active');
                    mainContent.style.opacity = '0';
                }, 100);
            }

            // Prevenir el scroll al arrastrar
            videoWrapper.addEventListener('touchmove', (e) => {
                if (isDragging) e.preventDefault();
            }, { passive: false });
            
            // Formulario
            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                alert('¡Registro exitoso! Bienvenido a KaKo.');
            });
        });
    </script>      
</body>
</html>
